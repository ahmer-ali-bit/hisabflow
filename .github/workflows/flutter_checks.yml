name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and publish diagnostics
        shell: bash
        run: |
          set +e
          flutter analyze --machine > "$RUNNER_TEMP/flutter-analyze.txt"
          analyze_status=$?
          python3 - "$RUNNER_TEMP/flutter-analyze.txt" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          output = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          for line in output.splitlines():
              fields = line.split('|', 7)
              if len(fields) == 8 and fields[0] in {'ERROR', 'WARNING', 'INFO'}:
                  severity, _, code, file_path, row, col, _, message = fields
                  path = pathlib.Path(file_path)
                  try:
                      path = path.relative_to(root)
                  except ValueError:
                      pass
                  level = {'ERROR': 'error', 'WARNING': 'warning', 'INFO': 'notice'}[severity]
                  clean = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::{level} file={path},line={row},col={col}::{code}: {clean}')
              else:
                  print(line)
          PY
          exit "$analyze_status"
      - name: Run tests
        if: always()
        run: flutter test --reporter expanded
