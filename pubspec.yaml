name: hisabflow
description: Offline-first cross-platform ledger management.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  sembast: ^3.7.2
  sembast_web: ^2.4.0
  uuid: ^4.5.1
  intl: ^0.19.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/hisabflow-mark.svg
